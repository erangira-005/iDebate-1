# Optional. Supabase's free plan pauses a project after about a week with no activity.
# This workflow calls a harmless function in your database twice a week so that is less likely.
#
# It needs no setup: it reads the project URL and key from config.js, which are public values anyway.
# Notes:
#  - GitHub switches scheduled workflows off after 60 days without any activity in the repository.
#    If that happens, open the Actions tab and re-enable it (or make any small commit).
#  - If you do not want this, delete this file.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Call the database
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" config.js || true)
          KEY=$(grep -oP "supabaseAnonKey:\s*'\K[^']+" config.js || true)
          case "$URL$KEY" in
            ""|*YOUR_*) echo "config.js has not been filled in yet, nothing to do."; exit 0 ;;
          esac
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Database answered."
